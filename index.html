<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GEAR BATTLE - Complete v2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#070a12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
button{font:inherit;border:0;border-radius:13px;padding:13px;width:100%;margin-top:8px;background:#6957f5;color:#fff;font-weight:900}
button:active{transform:scale(.98)}.secondary{background:#303b53}.danger{background:#a83e54}.gold{background:#9b741e}
#app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#172039,#080b12);padding-bottom:78px}
header{height:58px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;background:#202b43;border-bottom:1px solid #4b5c7d;position:sticky;top:0;z-index:10}
.screen{padding:14px}.hidden{display:none}.panel{background:#1a2335;border:1px solid #40516f;border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 8px 25px #0004}
.hero{height:170px;border-radius:16px;background:radial-gradient(circle,#8068ff,#27305d 48%,#111725);display:grid;place-items:center;font-size:76px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.row{display:flex;gap:8px}.row>*{flex:1}
.small{font-size:12px;color:#aeb9cc}.muted{color:#8996ad}.tag{font-size:11px;padding:3px 7px;border-radius:8px;background:#303c55;margin-left:5px}.rarity{font-weight:900}
.char{display:flex;gap:10px;align-items:center}.avatar{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:31px;background:linear-gradient(135deg,#6c5cff,#19b7ff);flex:none}
.bar{height:9px;background:#303748;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#55df7b}.enemy .bar i{background:#ff5969}
.stage{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:13px;background:#202a3e;border:1px solid #3c4c68;margin:8px 0}
.stage button{width:90px;margin:0}.cardrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.carditem{min-width:145px;background:#202a3e;border:1px solid #4a5c7c;border-radius:13px;padding:10px}.carditem .art{height:75px;border-radius:9px;background:linear-gradient(135deg,#6c5cff,#f052c8);display:grid;place-items:center;font-size:35px;margin-bottom:7px}
.log{height:125px;overflow:auto;background:#080b11;border-radius:10px;padding:9px;font-size:12px;line-height:1.65}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;gap:5px;padding:8px;background:#151a27;border-top:1px solid #38445d;z-index:20}.nav button{margin:0;padding:10px 2px;font-size:11px;background:#29334a}
.toast{display:none;position:fixed;z-index:30;left:50%;top:42%;transform:translate(-50%,-50%);padding:22px 28px;border:1px solid #a3a8ff;background:#111827ef;border-radius:18px;font-size:22px;font-weight:900;text-align:center}
.cut{animation:pop .5s ease}.flash{animation:flash .45s ease}@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes flash{0%{filter:brightness(2)}100%{filter:brightness(1)}}
.tabs{display:flex;gap:6px;overflow:auto}.tabs button{white-space:nowrap;margin:0;padding:9px 12px}.selected{outline:2px solid #fff}
.notice{padding:10px;border-radius:12px;background:#252f47;margin:8px 0;font-size:12px}
</style>
</head>
<body><div id="app">
<header><b>⚡ GEAR BATTLE</b><span id="wallet">💠 1500</span></header>

<section id="home" class="screen">
<div class="hero">⚡</div>
<div class="panel"><h2>出撃司令室</h2><p class="small">完全オリジナル素材で構成したスマホRPG試作版。</p>
<div class="grid"><button onclick="show('stages')">🗺️ 出撃</button><button onclick="show('party')">👥 編成</button><button onclick="show('cards')">🎴 カード</button><button onclick="show('gacha')">✨ 召喚</button><button onclick="show('story')">📖 物語</button><button onclick="show('roster')">👤 図鑑</button></div></div>
<div class="panel"><b>プレイヤーLv <span id="plv">1</span></b><div class="small">EXP <span id="pxp">0</span>/100</div><div class="bar"><i id="xpbar" style="width:0%"></i></div></div>
<div class="panel"><b>所持メンバー <span class="small">（所持 <span id="ownedCount">3</span>/10）</span></b><div id="homeTeam"></div></div>
</section>

<section id="stages" class="screen hidden"><h2>🗺️ ステージ選択</h2><div id="stageList"></div><button class="secondary" onclick="show('home')">戻る</button></section>

<section id="party" class="screen hidden"><h2>👥 パーティー編成</h2><p class="small">最大3人。タップで編成枠に追加/解除。</p><div id="partyRoster"></div><div class="panel"><b>現在の編成</b><div id="partySlots"></div></div><button onclick="show('home')">決定</button></section>

<section id="roster" class="screen hidden"><h2>👤 キャラクター図鑑</h2><div id="rosterList"></div><button class="secondary" onclick="show('home')">戻る</button></section>

<section id="cards" class="screen hidden"><h2>🎴 カード工房</h2><div id="cardList"></div><div class="panel"><b>カード強化 Lv.<span id="cardLv">1</span></b><p class="small">全キャラクターのATKを強化。</p><button onclick="upgradeCard()">💠100で強化</button></div><button class="secondary" onclick="show('home')">戻る</button></section>

<section id="gacha" class="screen hidden"><h2>✨ レゾナンス召喚</h2><div class="hero">✦</div><div class="panel"><p class="small">R 72% / SR 22% / SSR 6%</p><div class="row"><button onclick="draw(1)">1回 💠100</button><button onclick="draw(10)">10回 💠900</button></div><div id="gachaResult"></div></div><button class="secondary" onclick="show('home')">戻る</button></section>

<section id="story" class="screen hidden"><h2>📖 オリジナルストーリー</h2><div id="storyBox"></div><button onclick="nextStory()">次の話へ</button><button class="secondary" onclick="show('home')">戻る</button></section>

<section id="battle" class="screen hidden"><h2>⚔️ BATTLE</h2>
<div class="panel enemy"><b id="enemyName">虚影</b><span class="tag" id="enemyAttr">闇</span><div class="bar"><i id="enemyBar"></i></div><div class="small" id="enemyHP"></div></div>
<div id="teamBattle"></div><div class="log" id="battleLog"></div>
<div class="row"><button onclick="attack()">通常攻撃</button><button onclick="skill()">必殺技</button></div><div class="row"><button class="secondary" onclick="guard()">防御</button><button class="secondary" onclick="autoBattle()">AUTO</button></div>
<button class="danger" onclick="show('stages')">撤退</button></section>

<div id="toast" class="toast"></div>
<div class="nav"><button onclick="show('home')">ホーム</button><button onclick="show('stages')">出撃</button><button onclick="show('party')">編成</button><button onclick="show('cards')">カード</button><button onclick="show('gacha')">召喚</button></div>
</div>

<script>
const chars=[
{id:1,name:"ブレイヴァー",icon:"⚡",attr:"光",hp:620,atk:105,def:55,skill:"ライトニング・レイ"},
{id:2,name:"フレアランサー",icon:"🔥",attr:"火",hp:500,atk:125,def:42,skill:"ブレイズ・スピア"},
{id:3,name:"アクアセイバー",icon:"💧",attr:"水",hp:690,atk:88,def:70,skill:"アクア・ブレイク"},
{id:4,name:"ウィンドレイダー",icon:"🌪️",attr:"風",hp:560,atk:112,def:48,skill:"テンペスト・ラッシュ"},
{id:5,name:"グランドメイカー",icon:"🌿",attr:"地",hp:760,atk:78,def:88,skill:"アース・クラッシュ"},
{id:6,name:"シャドウノヴァ",icon:"🌑",attr:"闇",hp:530,atk:138,def:40,skill:"ノクターン・エッジ"},
{id:7,name:"サンダーハウル",icon:"⚡",attr:"雷",hp:580,atk:132,def:52,skill:"ボルト・ハウル"},
{id:8,name:"ルミナスベル",icon:"🌟",attr:"光",hp:650,atk:118,def:62,skill:"スター・セイヴァー"},
{id:9,name:"フェニックス",icon:"🪽",attr:"火",hp:610,atk:145,def:45,skill:"リバース・フレイム"},
{id:10,name:"ミラージュ",icon:"🔮",attr:"無",hp:600,atk:120,def:60,skill:"ミラージュ・ゼロ"}
];
const stages=[
{name:"夜明けの訓練",enemy:"夜影ドローン",attr:"闇",hp:650,unlock:1,reward:150,exp:70},
{name:"虚影部隊",enemy:"虚影部隊",attr:"闇",hp:1010,unlock:1,reward:220,exp:100},
{name:"深層の守護者",enemy:"深層の守護者",attr:"無",hp:1400,unlock:2,reward:300,exp:140},
{name:"紅蓮の決戦",enemy:"紅蓮獣",attr:"水",hp:1900,unlock:3,reward:420,exp:190},
{name:"星海の終点",enemy:"星海王",attr:"無",hp:2600,unlock:4,reward:600,exp:260}
];
let state={coins:1500,lv:1,xp:0,cardLv:1,story:0,owned:[1,2,3],party:[1,2,3],cleared:0};
let team=[],eh=0,enemyMax=0,stage=1,guarding=false,busy=false,auto=false;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("gearBattleSaveV2",JSON.stringify(state))}
function load(){try{const x=JSON.parse(localStorage.getItem("gearBattleSaveV2"));if(x)state={...state,...x}}catch(e){}}
function c(id){return chars.find(x=>x.id===id)}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));$(id).classList.remove("hidden");render()}
function render(){
$("wallet").textContent="💠 "+state.coins;$("plv").textContent=state.lv;$("pxp").textContent=state.xp;$("xpbar").style.width=state.xp+"%";$("ownedCount").textContent=state.owned.length;
$("homeTeam").innerHTML=state.party.map(id=>{let x=c(id);return `<p>${x.icon} ${x.name} <span class="tag">${x.attr}</span></p>`}).join("");
$("cardLv").textContent=state.cardLv;renderStages();renderParty();renderRoster();renderCards();renderStory();renderBattle();
}
function renderStages(){
$("stageList").innerHTML=stages.map((s,i)=>{let n=i+1,ok=n<=state.cleared+1&&n>=s.unlock;return `<div class="stage"><div><b>${String(n).padStart(2,"0")}　${s.name}</b><div class="small">${ok?"敵":"🔒 未解放"}　HP ${s.hp}　💠${s.reward}</div></div><button ${ok?"":"disabled"} onclick="startBattle(${n})">${ok?"出撃":"LOCK"}</button></div>`}).join("");
}
function renderParty(){
$("partyRoster").innerHTML=state.owned.map(id=>{let x=c(id),sel=state.party.includes(id);return `<div class="panel char ${sel?"selected":""}" onclick="toggleParty(${id})"><div class="avatar">${x.icon}</div><div><b>${x.name}</b><span class="tag">${x.attr}</span><div class="small">HP ${x.hp} / ATK ${x.atk} / DEF ${x.def}</div></div></div>`}).join("");
$("partySlots").innerHTML=state.party.map((id,i)=>{let x=c(id);return `<div>${i+1}. ${x.icon} ${x.name}</div>`}).join("")||"未編成";
}
function toggleParty(id){if(state.party.includes(id)){if(state.party.length>1)state.party=state.party.filter(x=>x!==id)}else if(state.party.length<3)state.party.push(id);save();render()}
function renderRoster(){
$("rosterList").innerHTML=chars.map(x=>{let own=state.owned.includes(x.id);return `<div class="panel char"><div class="avatar">${own?x.icon:"?"}</div><div><b>${own?x.name:"？？？？"}</b><span class="tag">${own?x.attr:"未入手"}</span><div class="small">${own?`必殺技：${x.skill}`:"召喚で入手"}</div></div></div>`}).join("");
}
function renderCards(){
$("cardList").innerHTML=`<div class="cardrow">${Array.from({length:Math.max(1,state.owned.length)},(_,i)=>`<div class="carditem"><div class="art">${i%2?"✦":"⚡"}</div><b>共鳴カード ${i+1}</b><div class="small">SSR　ATK +${20+state.cardLv*8}</div></div>`).join("")}</div>`;
}
const story=[
["第1話　微かな共鳴","街の上空に、見たことのない光が走った。ブレイヴァーは仲間とともに出撃する。"],
["第2話　炎と水","フレアランサーとアクアセイバーが合流。属性の違う力を重ねることで、共鳴率が上昇した。"],
["第3話　深層へ","敵の反応は地下深くへ続いている。チームは未知の領域へ進む決意を固めた。"],
["第4話　新たな仲間","戦場で風を操る戦士と遭遇。彼女は敵ではなく、同じ光を追っていた。"],
["第5話　星海の扉","最後の扉が開く。すべての共鳴をひとつにして、決戦へ向かう。"]
];
function renderStory(){let s=story[Math.min(state.story,story.length-1)];$("storyBox").innerHTML=`<div class="panel cut"><h3>${s[0]}</h3><p>${s[1]}</p></div><div class="small">進行 ${Math.min(state.story+1,story.length)}/${story.length}</div>`}
function nextStory(){if(state.story<story.length-1)state.story++;save();render();toast("📖 ストーリー更新")}
function startBattle(n){stage=n;let s=stages[n-1];enemyMax=s.hp;eh=enemyMax;team=state.party.map(id=>{let x=c(id);return {...x,cur:x.hp}});guarding=false;busy=false;auto=false;$("enemyName").textContent=s.enemy;$("enemyAttr").textContent=s.attr;$("battleLog").innerHTML="";show("battle");log("⚔️ 戦闘開始！ "+s.name)}
function alive(){return team.filter(x=>x.cur>0)}
function mult(a,b){if(a==="光"&&b==="闇")return 1.5;if(a==="闇"&&b==="光")return 1.3;if(a==="火"&&b==="水")return .8;if(a==="水"&&b==="火")return 1.5;if(a==="雷"&&b==="水")return 1.5;return 1}
function enemyTurn(){let a=alive();if(!a.length)return;let t=a[Math.floor(Math.random()*a.length)],d=Math.max(10,Math.floor(45+Math.random()*35-t.def*.22));if(guarding)d=Math.floor(d*.45);t.cur-=d;log(`👾 敵攻撃 → ${t.name} に ${d}ダメージ`);guarding=false}
function finish(){
if(eh<=0){eh=0;let s=stages[stage-1];state.coins+=s.reward;state.xp+=s.exp;state.cleared=Math.max(state.cleared,stage);while(state.xp>=100){state.xp-=100;state.lv++}save();log(`🎉 勝利！ 💠${s.reward} / EXP ${s.exp}`);toast("🎉 VICTORY");busy=true}
else if(!alive().length){log("💥 全滅…");toast("DEFEAT");busy=true}
render();if(auto&&!busy)setTimeout(attack,650)
}
function attack(){if(busy||eh<=0)return;let a=alive();if(!a.length)return;let c=a[0],d=Math.floor((c.atk+state.cardLv*8)*(0.9+Math.random()*.22)*mult(c.attr,$("enemyAttr").textContent));eh-=d;log(`${c.icon} ${c.name} の通常攻撃！ ${d}ダメージ`);if(eh>0)enemyTurn();finish()}
function skill(){if(busy||eh<=0)return;let a=alive();if(!a.length)return;let c=a[Math.floor(Math.random()*a.length)],d=Math.floor(c.atk*3.0+state.cardLv*12+Math.random()*90);eh-=d;log(`✨ ${c.name} 必殺技「${c.skill}」！！ ${d}ダメージ`);toast("✨ 必殺技！");$("teamBattle").classList.add("flash");setTimeout(()=>$("teamBattle").classList.remove("flash"),450);if(eh>0)enemyTurn();finish()}
function guard(){if(busy||eh<=0)return;guarding=true;log("🛡️ 防御態勢！ 次のダメージを軽減");enemyTurn();finish()}
function autoBattle(){if(busy)return;auto=!auto;log(auto?"▶ AUTO ON":"■ AUTO OFF");if(auto)attack()}
function renderBattle(){
if(!$("teamBattle"))return;$("enemyBar").style.width=(enemyMax?Math.max(0,eh/enemyMax*100):0)+"%";$("enemyHP").textContent=`HP ${Math.max(0,eh)} / ${enemyMax}`;
$("teamBattle").innerHTML=team.map(x=>`<div class="panel char"><div class="avatar">${x.icon}</div><div style="flex:1"><b>${x.name}</b><span class="tag">${x.attr}</span><div class="bar"><i style="width:${Math.max(0,x.cur/x.hp*100)}%"></i></div><div class="small">HP ${Math.max(0,x.cur)}/${x.hp}</div></div></div>`).join("");
}
function log(t){$("battleLog").innerHTML+=t+"<br>";$("battleLog").scrollTop=99999}
function draw(n){let cost=n===1?100:900;if(state.coins<cost){toast("💠 コイン不足");return}state.coins-=cost;let out=[];
for(let i=0;i<n;i++){let r=Math.random(),rar=r<.06?"SSR":r<.28?"SR":"R";let id;if(rar==="SSR"){id=[6,7,8,9,10][Math.floor(Math.random()*5)]}else if(rar==="SR"){id=[4,5,6,7][Math.floor(Math.random()*4)]}else{id=[1,2,3,4][Math.floor(Math.random()*4)]}
let x=c(id);let fresh=!state.owned.includes(id);if(fresh)state.owned.push(id);out.push(`<div class="panel"><span class="rarity">${rar}</span>　${x.icon} ${x.name} ${fresh?"✨ NEW!":"（所持済み）"}</div>`)}
save();$("gachaResult").innerHTML=out.join("");render();toast("✨ 召喚完了")}
function upgradeCard(){if(state.coins<100){toast("💠 コイン不足");return}state.coins-=100;state.cardLv++;save();render();toast("🎴 カード強化！")}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",950)}
load();render();
</script></body></html>
