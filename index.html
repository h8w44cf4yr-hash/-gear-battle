<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gear Battle Prototype</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#10131b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
#app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(#171c2b,#0b0d13);overflow:hidden}
header{padding:14px 16px;background:#20283a;border-bottom:1px solid #3c4962;display:flex;justify-content:space-between}
h1{font-size:18px;margin:0}.screen{padding:16px}.hidden{display:none}
.card{background:#202638;border:1px solid #44516e;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 6px 18px #0005}
.hero{height:190px;border-radius:16px;background:radial-gradient(circle at 50% 30%,#8b5cf6,#252047 48%,#111522);display:flex;align-items:center;justify-content:center;font-size:72px}
.stats{display:flex;gap:8px;margin-top:10px}.stat{flex:1;background:#151a27;border-radius:10px;padding:8px;text-align:center;font-size:12px}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:9px;background:#6d5dfc;color:white;font-weight:700;font-size:15px}
button.alt{background:#30394f}.row{display:flex;gap:8px}.row button{flex:1}
.hp{height:12px;background:#303644;border-radius:99px;overflow:hidden}.hp>i{display:block;height:100%;background:#5ee17a;width:100%}
.enemy .hp>i{background:#ff5f6d}.log{height:110px;overflow:auto;background:#0b0e15;border-radius:10px;padding:10px;font-size:12px;line-height:1.7}
.big{font-size:25px;font-weight:800;text-align:center;margin:12px}.menu{position:sticky;bottom:0;padding:10px;background:#171b27;display:flex;gap:7px}.menu button{margin:0;padding:11px 5px;font-size:12px}
small{color:#aeb8ca}
</style>
</head>
<body>
<div id="app">
<header><h1>GEAR BATTLE</h1><span id="coins">💠 1000</span></header>

<section id="home" class="screen">
  <div class="hero">⚡</div>
  <div class="card">
    <h2>出撃準備</h2>
    <p>オリジナル試作キャラクターで戦う、オフライン型バトルデモ。</p>
    <button onclick="show('party')">パーティー編成</button>
    <button onclick="show('gacha')" class="alt">召喚（ガチャ）</button>
    <button onclick="startBattle()" class="alt">▶ バトル開始</button>
  </div>
  <div class="card"><b>所持キャラクター</b><p>⚡ レゾナンス・ブレイヴァー　Lv.10</p><small>ATK 120 / HP 900</small></div>
</section>

<section id="party" class="screen hidden">
<h2>パーティー編成</h2>
<div class="card"><div style="font-size:46px">⚡</div><b>レゾナンス・ブレイヴァー</b><br><small>属性：光　Lv.10</small>
<div class="stats"><div class="stat">HP<br><b>900</b></div><div class="stat">ATK<br><b>120</b></div><div class="stat">DEF<br><b>80</b></div></div></div>
<button onclick="show('home')">決定</button>
</section>

<section id="gacha" class="screen hidden">
<h2>召喚</h2>
<div class="hero">✦</div>
<div class="card"><b>1回召喚</b><br><small>💠 100</small><button onclick="draw()">召喚する</button><p id="result"></p></div>
<button onclick="show('home')" class="alt">戻る</button>
</section>

<section id="battle" class="screen hidden">
<h2>バトル</h2>
<div class="card enemy"><b>虚影ユニット</b><div class="hp"><i id="enemyhp"></i></div><small id="enemytext">HP 600 / 600</small></div>
<div class="card"><div class="big">⚡</div><b>レゾナンス・ブレイヴァー</b><div class="hp"><i id="playerhp"></i></div><small id="playertext">HP 900 / 900</small></div>
<div class="log" id="log"></div>
<div class="row"><button onclick="attack()">通常攻撃</button><button onclick="skill()">必殺技</button></div>
<button onclick="show('home')" class="alt">撤退</button>
</section>

<div class="menu">
<button onclick="show('home')">ホーム</button><button onclick="show('party')">編成</button><button onclick="show('gacha')">召喚</button><button onclick="startBattle()">出撃</button>
</div>
</div>
<script>
let eh=600, ph=900, coins=1000, turn=0;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}
function startBattle(){eh=600;ph=900;turn=0;update();$('log').innerHTML='戦闘開始！<br>';show('battle')}
function update(){
 $('enemyhp').style.width=Math.max(0,eh/600*100)+'%';$('playerhp').style.width=Math.max(0,ph/900*100)+'%';
 $('enemytext').textContent=`HP ${Math.max(0,eh)} / 600`; $('playertext').textContent=`HP ${Math.max(0,ph)} / 900`;
 $('coins').textContent='💠 '+coins;
}
function enemyTurn(){if(eh<=0)return;let d=45+Math.floor(Math.random()*26);ph-=d;$('log').innerHTML+=`敵の攻撃！ ${d}ダメージ。<br>`;if(ph<=0){ph=0;$('log').innerHTML+='<b>敗北…</b><br>'}}
function check(){if(eh<=0){eh=0;$('log').innerHTML+='<b>🎉 勝利！</b><br>'}else if(ph<=0){ph=0}}
function attack(){if(eh<=0||ph<=0)return;let d=75+Math.floor(Math.random()*31);eh-=d;$('log').innerHTML+=`通常攻撃！ ${d}ダメージ。<br>`;enemyTurn();check();update()}
function skill(){if(eh<=0||ph<=0)return;let d=170+Math.floor(Math.random()*81);eh-=d;$('log').innerHTML+=`⚡ 必殺技発動！ ${d}ダメージ！！<br>`;enemyTurn();check();update()}
function draw(){if(coins<100)return;$('result').textContent='';coins-=100;let r=Math.random();let rarity=r<.08?'SSR':r<.28?'SR':'R';setTimeout(()=>{$('result').innerHTML=`✨ ${rarity}「レゾナンス・カード」獲得！`;update()},150)}
update();
</script>
</body></html>
